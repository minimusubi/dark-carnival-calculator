<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='utf-8'>
		<title>Dark Carnival Calculator - 404</title>
		<meta name='viewport' content='width=device-width,initial-scale=1'>
		<meta name='mobile-web-app-capable' content='yes'>
		<meta name='apple-mobile-web-app-capable' content='yes'>
		<link rel='apple-touch-icon' href='/assets/icons/apple-touch-icon.png'>
		<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css' rel='stylesheet' integrity='sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65' crossorigin='anonymous'>
		<style>
			:root {
				--primary-dark: #59475F;
				--primary-light: #7A5480;
				--link: #C889DE;
				--outline: rgb(185 230 255);
			}
			
			html, body {
				/* font: 14px/1.21 'Helvetica Neue', arial, sans-serif; */
				margin: 0;
			}

			body {
				display: flex;
				justify-content: center;
				align-items: center;
				/* width: 100%; */
				min-height: 100vh;
				background: #36393f;
			}
			
			a {
				color: var(--link);
				text-decoration: none;
			}
			
			a:focus {
				outline: none;
				box-shadow: 0 0 0 3px var(--outline);
			}
			
			p {
				line-height: 1.5;
			}
			
			.card {
				--bs-card-bg: #2d2f34;
				--bs-card-color: #ebebeb;
			}
			
			.btn {
				--bs-btn-border-radius: 2rem;
			}
			
			.btn-primary {
				--bs-btn-bg: var(--primary-light);
				--bs-btn-border-color: var(--primary-light);
				--bs-btn-hover-bg: var(--primary-dark);
				--bs-btn-hover-border-color: var(--primary-dark);
				--bs-btn-active-bg: var(--primary-dark);
				--bs-btn-active-border-color: var(--primary-dark);
			}
			
			.btn-dark {
				--bs-btn-bg: transparent;
				--bs-btn-border-color: transparent;
				--bs-btn-hover-border-color: var(--bs-btn-border-color);
				--bs-btn-active-border-color: var(--bs-btn-border-color);
			}
		</style>
		<link rel='preconnect' href='https://fonts.gstatic.com'>
		<link href='https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;display=swap' rel='stylesheet'>
		<link href='https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,300,0,0' rel='stylesheet'>
	</head>
	<body>
		<div class='card m-3' style='max-width: 35rem;'>
			<div class='card-body'>
				<h5 class='card-title'>404 Not Found</h5>
				<p class='card-text'>Sorry, that resource doesn't exist. Please check your spelling and try again.</p>
				<div class='text-end'>
					<div>
						<a href='javascript:history.back();' class='btn btn-dark d-inline-flex'>
							<span class='material-symbols-rounded pe-2'>
								chevron_right
							</span>
							Go Back
						</a>
					</div>
					<div class='mt-2'>
						<a href='/' class='btn btn-primary d-inline-flex'>
							<span class='material-symbols-rounded pe-2'>
								chevron_right
							</span>
							Go Home
						</a>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
